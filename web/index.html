<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Visual AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d14; overflow: hidden; font-family: monospace; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d0d14;
      z-index: 10;
    }
    #overlay h2 { color: #888; margin-bottom: 24px; font-size: 15px; letter-spacing: 2px; }
    #rpm-input {
      width: 480px; padding: 10px 14px;
      background: #1a1a24; border: 1px solid #333; border-radius: 6px;
      color: #ccc; font-size: 13px; outline: none;
    }
    #rpm-input:focus { border-color: #555; }
    #load-btn {
      margin-top: 12px; padding: 10px 32px;
      background: #2a2a3a; border: 1px solid #444; border-radius: 6px;
      color: #aaa; cursor: pointer; font-size: 13px; letter-spacing: 1px;
    }
    #load-btn:hover { background: #333; color: #ddd; }
    #hint { color: #444; font-size: 11px; margin-top: 16px; line-height: 1.7; text-align: center; }
    #hint a { color: #556; }

    #status {
      position: fixed; bottom: 12px; left: 0; right: 0;
      text-align: center; color: #333; font-size: 11px;
      pointer-events: none; z-index: 5;
    }
    #status.active { color: #3a6; }
    #status.error  { color: #633; }

    #amplitude-bar {
      position: fixed; bottom: 0; left: 0; height: 3px;
      background: #2a5a3a; width: 0%; transition: width 0.05s;
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="overlay" style="display:none"></div>

<div id="status">waiting for server...</div>
<div id="amplitude-bar"></div>

<script type="importmap">
{
  "imports": {
    "three":          "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js",
    "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/"
  }
}
</script>
<script type="module" src="avatar.js"></script>

</body>
</html>
